<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Left Wing Gradient: Luminous Periwinkle to Indigo -->
    <linearGradient id="veyraLeftGrad" x1="10%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#9DB7FD" />
      <stop offset="25%" stop-color="#8EA4FA" />
      <stop offset="55%" stop-color="#7C8CEA" />
      <stop offset="80%" stop-color="#6974CB" />
      <stop offset="100%" stop-color="#555EA8" />
    </linearGradient>

    <!-- Right Wing Gradient: Radiant Lavender to Twilight Indigo -->
    <linearGradient id="veyraRightGrad" x1="85%" y1="0%" x2="35%" y2="100%">
      <stop offset="0%" stop-color="#BEB9FA" />
      <stop offset="28%" stop-color="#A39DEE" />
      <stop offset="60%" stop-color="#8378D8" />
      <stop offset="85%" stop-color="#5D52AE" />
      <stop offset="100%" stop-color="#3C317A" />
    </linearGradient>

    <!-- Fold Crease Gradient for authentic 3D depth at the bottom curve -->
    <linearGradient id="veyraFoldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#3E4485" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#363A75" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#2D3064" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Left Main Wing: Sweeping V stroke with natural flare and rounded base -->
  <path
    d="M 5 6.5
       C 2 7 1 9.5 2 13
       C 4 20 9.5 35 16 51
       C 21.5 64 27 77.5 33.5 88
       C 36.5 93 40.5 96.5 44.5 96.5
       C 48 96.5 51.5 93 54.5 88
       C 57.5 83 61.5 78 64.5 75.5
       C 66.5 73.5 66 70.5 64 69.5
       C 61.5 68 57.5 68 54 65
       C 49 61 44 49 38 35
       C 31.5 21 24.5 11 19.5 8
       C 15.5 5.5 9.5 6 5 6.5 Z"
    fill="url(#veyraLeftGrad)"
  />

  <!-- Authentic Dimensional Crease / Under-fold -->
  <path
    d="M 43.5 96.5
       C 47.5 96.5 51 93 54 88
       C 57 83 61 78 64 75.5
       C 65.5 74 65.5 71.5 64 70
       C 61.5 68.5 57 68.5 53.5 65
       C 48.5 60.5 44 56 40.5 62
       C 38 67 40 85 43.5 96.5 Z"
    fill="url(#veyraFoldGrad)"
  />

  <!-- Right Floating Wing / Petal -->
  <path
    d="M 82 3
       C 87 3.5 92 6 93 10
       C 93.5 14 90.5 25 85 38
       C 79.5 49 73.5 58.5 67 61
       C 62 62.5 58 59.5 57.5 54.5
       C 57 49 60.5 37.5 66.5 25
       C 71.5 14 77 5 82 3 Z"
    fill="url(#veyraRightGrad)"
  />
</svg>