<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Left Wing Gradient: Luminous Periwinkle to Royal Indigo -->
    <linearGradient id="blVeyraLeftGrad" x1="15%" y1="0%" x2="65%" y2="100%">
      <stop offset="0%" stop-color="#9EB4FD" />
      <stop offset="45%" stop-color="#8296F8" />
      <stop offset="100%" stop-color="#6072DE" />
    </linearGradient>

    <!-- Right Wing Gradient: Radiant Lavender to Twilight Purple -->
    <linearGradient id="blVeyraRightGrad" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#B2ABFB" />
      <stop offset="45%" stop-color="#9488EE" />
      <stop offset="100%" stop-color="#6F5FD4" />
    </linearGradient>

    <!-- Fold Crease Gradient for origami 3D depth at the apex -->
    <linearGradient id="blVeyraFoldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#4B539A" />
      <stop offset="100%" stop-color="#2D3367" />
    </linearGradient>
  </defs>

  <!-- Main Left Sweeping Arm with rounded top and curved outer contour -->
  <path
    d="M 16 22
       C 13 25 12 30 14 36
       C 18 48 27 68 37 83
       C 41 89 45 92 49 91
       C 53 90 56 86 55.5 80
       C 55 74 51.5 67 47 61
       C 40 51 31 35 26 23
       C 24 19 19 19 16 22 Z"
    fill="url(#blVeyraLeftGrad)"
  />

  <!-- Origami Fold Facet at the apex -->
  <path
    d="M 39 84
       C 43 90 46.5 92.5 49.5 91
       C 52.5 89.5 56 85 55.5 80
       C 55 74 51.5 67 47 61
       C 44 67 41 76 39 84 Z"
    fill="url(#blVeyraFoldGrad)"
  />

  <!-- Detached Floating Right Pill / Capsule -->
  <rect
    x="57"
    y="17"
    width="17.5"
    height="45"
    rx="8.75"
    transform="rotate(20 65.75 39.5)"
    fill="url(#blVeyraRightGrad)"
  />
</svg>